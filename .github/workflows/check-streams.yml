name: Validate IPTV and Radio Streams

on:
  schedule:
    - cron: '0 2 * * *'        # 每天 UTC 02:00 自动跑
  workflow_dispatch:            # 支持手动触发

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 留余量，GitHub 上限 6h
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run Stream Validator
        run: python validate_streams.py

      - name: Commit and Push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ report.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update valid streams and report [skip ci]"
            git push
          fi
